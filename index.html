<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="description" content="M2 Imóveis e Loteamentos: casas, apartamentos e lotes para comprar e alugar em Parnaíba.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script>
(() => {
  const CFG = {
    apiKey: ["AIza", "SyCUX45V2IAUV", "segPtR67ABPYJwTLNlAaEA"].join(""),   // chave pública do Firebase (pode ficar no site)
    authDomain: "m2-imoveis.firebaseapp.com",
    projectId: "m2-imoveis",
    storageBucket: "m2-imoveis.firebasestorage.app",
    messagingSenderId: "96300587007",
    appId: "1:96300587007:web:9bd251f10783b19429f9ca"
  };
  if (!window.firebase) { window.M2_FAIL = "Não foi possível carregar o Firebase. Verifique a internet e recarregue a página."; return; }
  firebase.initializeApp(CFG);
  const auth = firebase.auth(), fs = firebase.firestore();
  let storage = null; try { storage = firebase.storage(); } catch (e) {}
  const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, "");
  const clean = o => JSON.parse(JSON.stringify(o, (k, v) => v === undefined ? null : v));
  let sess = null, staff = false;

  const ready = new Promise(res => {
    let first = true;
    auth.onAuthStateChanged(async u => {
      sess = null; staff = false;
      if (u) {
        try {
          const d = await fs.doc("usuarios/" + u.uid).get();
          if (d.exists && d.data().ativo !== false) { const x = d.data(); staff = true; sess = {id: u.uid, nome: x.nome || u.email, perfil: x.perfil || "Corretor", email: u.email}; }
        } catch (e) { console.warn(e); }
      }
      if (first) { first = false; res(); }
    });
  });

  const errMsg = e => ({
    "auth/invalid-credential": "Usuário ou senha incorretos.", "auth/wrong-password": "Usuário ou senha incorretos.", "auth/user-not-found": "Usuário ou senha incorretos.",
    "auth/invalid-email": "E-mail inválido.", "auth/too-many-requests": "Muitas tentativas. Aguarde alguns minutos e tente de novo.",
    "auth/email-already-in-use": "Este e-mail já tem cadastro no sistema.", "auth/weak-password": "Senha fraca: use pelo menos 6 caracteres.",
    "auth/network-request-failed": "Sem conexão com a internet.", "permission-denied": "Você não tem permissão para esta ação.",
  }[e && e.code] || (e && e.message) || "Não foi possível concluir. Tente de novo.");

  const wrapDoc = r => ({ id: r.id, get: () => r.get(), onSnapshot: (a, b) => r.onSnapshot(a, b),
    set: d => r.set(clean(d)), update: d => r.update(clean(d)), delete: () => r.delete() });
  const db = {
    collection: col => { const ref = fs.collection(col); return {
      onSnapshot: (cb, err) => (col === "imoveis" && !staff ? ref.where("publicar", "==", true) : ref).onSnapshot(cb, err),
      doc: id => wrapDoc(id ? ref.doc(id) : ref.doc()),
      add: async d => wrapDoc(await ref.add(clean(d))),
    }; },
    doc: p => wrapDoc(fs.doc(p)),
  };
  async function shrink(file){
    const bm = await createImageBitmap(file); const w = Math.min(1600, bm.width), h = Math.round(bm.height * w / bm.width);
    const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(bm, 0, 0, w, h);
    return await new Promise(r => c.toBlob(r, "image/jpeg", 0.82));
  }
  const assets = { async upload(file){
    if (!storage) throw {message: "O envio de fotos ainda não foi ativado no Firebase (Storage)."};
    const blob = await shrink(file); const name = "fotos/" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + ".jpg";
    try { const r = storage.ref(name); await r.put(blob, {contentType: "image/jpeg"}); const url = await r.getDownloadURL(); return {id: url, url}; }
    catch (e) { throw {message: e.code === "storage/unauthorized" ? "Sem permissão para enviar fotos." : (e.code || "").startsWith("storage/") ? "O envio de fotos ainda não está ativo no Firebase (Storage)." : errMsg(e)}; }
  } };

  window.M2_AUTH = {
    session: () => sess,
    async login(u, p){
      u = String(u || "").trim();
      let email = u;
      if (!u.includes("@")) { const m = await fs.doc("logins/" + norm(u)).get().catch(() => null); if (!m || !m.exists) throw {message: "Usuário ou senha incorretos."}; email = m.data().email; }
      let cred; try { cred = await auth.signInWithEmailAndPassword(email.trim().toLowerCase(), p); } catch (e) { throw {message: errMsg(e)}; }
      const uid = cred.user.uid; let d = await fs.doc("usuarios/" + uid).get();
      if (!d.exists) {
        // primeiro administrador: só funciona para o e-mail liberado nas regras do Firestore
        try {
          await fs.doc("usuarios/" + uid).set({nome: "ADMINISTRADOR", usuario: "admin", email: cred.user.email, perfil: "Administrador", ativo: true, criadoEm: new Date().toISOString()});
          await fs.doc("logins/admin").set({email: cred.user.email}).catch(() => {});
          d = await fs.doc("usuarios/" + uid).get();
        } catch (e) { /* não é o primeiro administrador */ }
      }
      if (!d.exists) { await auth.signOut(); throw {message: "Seu acesso ainda não foi liberado. Fale com o administrador."}; }
      if (d.data().ativo === false) { await auth.signOut(); throw {message: "Seu acesso está bloqueado. Fale com o administrador."}; }
      const x = d.data(); return {id: uid, nome: x.nome, perfil: x.perfil || "Corretor", email: cred.user.email};
    },
    async logout(){ await auth.signOut(); },
    async reset(u){
      u = String(u || "").trim(); let email = u;
      if (!u.includes("@")) { const m = await fs.doc("logins/" + norm(u)).get().catch(() => null); if (!m || !m.exists) throw {message: "Digite o seu e-mail no campo de usuário para receber o link."}; email = m.data().email; }
      try { await auth.sendPasswordResetEmail(email.toLowerCase()); } catch (e) { throw {message: errMsg(e)}; }
      return email;
    },
    async createUser(o){
      const email = String(o.email || "").trim().toLowerCase(); const login = norm(o.usuario);
      const ex = await fs.doc("logins/" + login).get(); if (ex.exists) throw {message: "Já existe alguém com esse usuário. Escolha outro.", field: "usuario"};
      const sec = firebase.apps.find(a => a.name === "sec") || firebase.initializeApp(CFG, "sec");
      let cred; try { cred = await sec.auth().createUserWithEmailAndPassword(email, o._senha); } catch (e) { throw {message: errMsg(e), field: e.code === "auth/weak-password" ? "senha" : "email"}; }
      const uid = cred.user.uid; await sec.auth().signOut();
      const {_senha, senhaHash, ...rest} = o;
      await fs.doc("usuarios/" + uid).set(clean({...rest, usuario: login, email, criadoEm: new Date().toISOString()}));
      await fs.doc("logins/" + login).set({email});
      return uid;
    },
    async updateUser(id, o, old){
      const login = norm(o.usuario); const {_senha, senhaHash, email, ...rest} = o;
      if (login !== old.usuario) { const ex = await fs.doc("logins/" + login).get(); if (ex.exists) throw {message: "Já existe alguém com esse usuário. Escolha outro.", field: "usuario"}; }
      await fs.doc("usuarios/" + id).update(clean({...rest, usuario: login}));
      if (login !== old.usuario) { await fs.doc("logins/" + login).set({email: old.email}); if (old.usuario) await fs.doc("logins/" + old.usuario).delete().catch(() => {}); }
    },
  };
  window.claude = { use: async n => { await ready;
    if (n === "db") return db;
    if (n === "user") return {can: () => staff, isOwner: () => staff};
    if (n === "assets") return staff ? assets : null;
    return null; } };
})();
</script>
<title>M2 Imóveis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra fixa com marca e abas; conteúdo em painéis de trabalho; vitrine em grade de cartões com foto */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --sunk:#e9ebe6; --ink:#18201f; --muted:#5b6662; --line:#d9ddd6;
  --accent:#1d3b85; --accent-ink:#ffffff; --warm:#a87610; --gold:#c59019; --ll:block; --ld:none;
  --ok:#2f7a4b; --ok-bg:#e3f1e7; --warn:#946b00; --warn-bg:#f8eecb; --bad:#a63a2f; --bad-bg:#f6e0dc; --info:#27466f; --info-bg:#e1e8f2;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111517; --surface:#192023; --sunk:#0d1012; --ink:#e6eae8; --muted:#97a3a0; --line:#2a3337;
  --accent:#93b0ec; --accent-ink:#0f1a2a; --warm:#e2b04f; --gold:#e2b04f; --ll:none; --ld:block;
  --ok:#7cc898; --ok-bg:#16301f; --warn:#e7c35c; --warn-bg:#33290c; --bad:#ef8a7e; --bad-bg:#3a1a16; --info:#8db0e3; --info-bg:#18263a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111517; --surface:#192023; --sunk:#0d1012; --ink:#e6eae8; --muted:#97a3a0; --line:#2a3337;
  --accent:#93b0ec; --accent-ink:#0f1a2a; --warm:#e2b04f; --gold:#e2b04f; --ll:none; --ld:block;
  --ok:#7cc898; --ok-bg:#16301f; --warn:#e7c35c; --warn-bg:#33290c; --bad:#ef8a7e; --bad-bg:#3a1a16; --info:#8db0e3; --info-bg:#18263a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .bar{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:36px;height:36px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:-.02em}
.mark sup{font-size:9px;margin-left:1px}
.brand b{font-family:var(--f-display);font-size:17px;font-weight:700}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:12px 12px 11px;border-bottom:2px solid transparent;font-weight:500}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding-block:24px 64px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-size:26px;font-weight:800}
.head p{margin:2px 0 0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-align:left;font-weight:500}
.linkbtn:hover{text-decoration:underline}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filters input,.filters select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.filters input[type=search]{flex:1 1 220px}

.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:24px}
.kpi{background:var(--surface);padding:14px 16px}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-size:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.list li:first-child{border-top:0}
.list .t{min-width:0}
.list .t small{display:block;color:var(--muted)}
.empty{color:var(--muted);padding:20px 0;text-align:center}
.emptybox{border:1px dashed var(--line);border-radius:var(--r);padding:32px 20px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.emptybox b{color:var(--ink);font-family:var(--f-display);font-size:17px}

/* bars */
.bars{display:grid;gap:8px}
.barrow{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;font-size:13px}
.barrow .track{height:10px;background:var(--sunk);border-radius:3px;overflow:hidden}
.barrow .fill{height:100%;background:var(--accent);border-radius:3px}

/* imóveis cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0}
.card:hover{border-color:var(--muted)}
.ph{aspect-ratio:4/3;max-width:100%;background:var(--sunk);position:relative;display:grid;place-items:center;color:var(--muted);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .ptxt{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.ph svg{position:absolute;inset:0;width:100%;height:100%;opacity:.35}
.ph .ilus,.galnote{font-size:11px;font-weight:600;letter-spacing:.03em}
.ph .ilus{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;padding:2px 8px;border-radius:99px}
.galnote{color:var(--muted);margin:-8px 0 14px}
.ph .tags{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap}
.ph .tags .pill{background:var(--surface)}
.card .body{padding:12px 14px 14px;display:grid;gap:4px}
.card .code{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.card h3{font-size:15px;font-weight:700}
.card .loc{color:var(--muted);font-size:13px}
.card .spec{font-size:13px;color:var(--muted);font-family:var(--f-mono)}
.price{font-family:var(--f-display);font-weight:700;color:var(--warm);font-variant-numeric:tabular-nums}
.card .price{font-size:17px}
.price small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:12px}

/* tables */
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:680px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunk)}
td small{display:block;color:var(--muted)}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{font-size:13px;display:flex;justify-content:space-between}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;gap:4px;font-size:13px}
.lead b{font-size:14px}
.lead small{color:var(--muted)}
.lead select{border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:3px 4px;font-size:12px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(10,14,16,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:10px;width:100%;max-width:760px;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mh h2{font-size:19px}
.modal .mb{padding:20px}
.modal .mf{display:flex;justify-content:space-between;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal .mf .r{display:flex;gap:8px;margin-left:auto}
.x{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.form{display:grid;grid-template-columns:repeat(6,1fr);gap:12px 14px}
.form .f{display:grid;gap:4px;grid-column:span 6;min-width:0;align-content:start}
.form .f.c2{grid-column:span 2}.form .f.c3{grid-column:span 3}.form .f.c1{grid-column:span 1}
.form label{font-size:12px;font-weight:600;color:var(--muted)}
.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface)}
.form textarea{min-height:90px;resize:vertical}
.form .chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:500}
.form .chk input{width:auto}
.form .sec{grid-column:span 6;font-family:var(--f-display);font-weight:700;font-size:13px;padding-top:6px;border-top:1px solid var(--line);margin-top:4px}
@media (max-width:560px){.form .f.c2,.form .f.c3{grid-column:span 6}.form .f.c1{grid-column:span 3}}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos .th{width:92px;height:70px;border-radius:6px;overflow:hidden;position:relative;background:var(--sunk)}
.photos .th img{width:100%;height:100%;object-fit:cover}
.photos .th button{position:absolute;top:2px;right:2px;background:var(--surface);border:0;border-radius:4px;cursor:pointer;font-size:12px;padding:0 5px}
.photos .add{width:92px;height:70px;border:1px dashed var(--line);border-radius:6px;display:grid;place-items:center;color:var(--muted);cursor:pointer;font-size:12px;text-align:center}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 18px;margin:0}
.dl div{min-width:0}
.dl dt{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.dl dd{margin:2px 0 0;overflow-wrap:anywhere}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-bottom:16px}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block}
.gal img:first-child{grid-column:1/-1;aspect-ratio:16/9}

.chip{display:inline-flex;align-items:center;gap:6px;background:var(--info-bg);color:var(--info);border-radius:99px;padding:4px 6px 4px 12px;font-weight:600}

.maploc{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--sunk);border-radius:var(--r);padding:12px 14px}

a.btn{text-decoration:none;color:inherit}

.smartbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-6px 0 16px}
.chip.sm{padding:2px 10px;font-size:12px}

.psearch{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.psearch input{flex:1 1 260px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-size:15px}

.althead{font-family:var(--f-display);font-weight:700;font-size:16px;margin:28px 0 10px}

/* ---------- Site público ---------- */
.sitemode header.top,.sitemode nav.bnav{display:none!important}
.sitemode main.gut{padding:0}
.sitemode main>.wrap{max-width:none}
.site{--sw:1200px;background:var(--bg);color:var(--ink);font-size:15px}
.swrap{max-width:var(--sw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.site h1,.site h2,.site h3{font-family:var(--f-display)}
.sbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:11px 22px;font-weight:700;text-decoration:none;border:2px solid transparent;cursor:pointer;font-size:14px;white-space:nowrap}

.shead{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.shbar{display:flex;align-items:center;gap:16px;min-height:72px}
.slogo{display:flex;align-items:center;margin-right:auto}

.sfavlink{display:inline-flex;align-items:center;gap:5px}
.sbadge{background:var(--gold);color:#1a1405;border-radius:99px;font-size:11px;padding:0 7px}
.sburger{display:none;background:none;border:0;color:var(--ink);cursor:pointer;padding:6px}
.shero{position:relative;background:linear-gradient(90deg,rgba(10,22,52,.88) 0%,rgba(10,22,52,.55) 55%,rgba(10,22,52,.2) 100%),var(--hero,none) center/cover no-repeat,#1d3b85;color:#fff}
.shgrid{display:grid;grid-template-columns:1fr minmax(320px,440px);gap:32px;align-items:center;padding-block:56px}
.shtxt h1{font-size:clamp(28px,4.4vw,48px);line-height:1.08;font-weight:800;margin:0 0 12px;color:#fff}
.shtxt p{font-size:17px;max-width:46ch;color:rgba(255,255,255,.88);margin:0}
.ssearch{background:var(--surface);color:var(--ink);border-radius:14px;padding:18px;display:grid;gap:12px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.stabs{display:flex;gap:6px;background:var(--sunk);padding:4px;border-radius:999px}
.stabs button{flex:1;border:0;background:none;padding:9px 6px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.stabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.sfields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sfields label,.sord{display:grid;gap:4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-width:0}
.ssearch select,.ssearch input,.sord select,.sform input,.sform select,.sform textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0;text-transform:none;letter-spacing:0;font-weight:400}
.sq{grid-column:1/-1;display:grid;gap:4px}
.sq>span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sq>div{display:flex;gap:6px}
.sq button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 0;font-weight:700;cursor:pointer;color:var(--ink)}
.sq button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ssec{padding-block:48px}
.salt{background:var(--surface)}
.ssec h2{font-size:clamp(22px,2.6vw,30px);margin:0 0 20px;color:var(--accent)}
.sc{text-align:center}
.shd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.shd h2{margin:0}
.spills{display:flex;gap:6px}
.spills button{border:2px solid var(--accent);background:none;color:var(--accent);border-radius:999px;padding:7px 18px;font-weight:700;cursor:pointer}
.spills button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s}
.scard:hover{box-shadow:0 10px 26px rgba(20,30,60,.14)}
.sph{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--sunk);overflow:hidden}
.sph img,.sgal img{width:100%;height:100%;object-fit:cover;display:block}
.snoph{display:grid;place-items:center;height:100%;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:13px;min-height:200px}
.sarr{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#111;font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center}
.sarr.l{left:8px}.sarr.r{right:8px}
.scount{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 8px;border-radius:99px}
.sheart{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#8a8f99;cursor:pointer;display:grid;place-items:center}
.sheart.on{color:#d23b4f}
.silus{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px}
.sdest{position:absolute;top:10px;left:10px;background:var(--gold);color:#1a1405;font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em}
.sbody{display:grid;gap:4px;padding:14px 16px 16px;text-decoration:none;color:inherit;flex:1}
.sloc{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:13px}
.scod{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.sbody h3{font-size:16px;margin:4px 0 0;color:var(--ink)}
.stit{margin:0;color:var(--muted);font-size:13px}
.sprice{font-family:var(--f-display);font-weight:800;font-size:21px;color:var(--accent);margin-top:6px;font-variant-numeric:tabular-nums}
.sprice small{font-size:13px;color:var(--muted);font-weight:600}
.sfeat{display:flex;flex-wrap:wrap;gap:6px 14px;border-top:1px solid var(--line);padding-top:10px;margin-top:8px;color:var(--muted);font-size:13px}
.sfeat span{display:inline-flex;align-items:center;gap:5px}
.smore{text-align:center;margin-top:26px}
.sempty{color:var(--muted);padding:24px 0}
.sdif{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.sdif div{border-top:4px solid var(--gold);background:var(--bg);border-radius:10px;padding:18px}
.sdif h3{margin:0 0 6px;font-size:17px;color:var(--accent)}
.sdif p{margin:0;color:var(--muted)}
.scta{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:32px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.scta h2{color:inherit;margin:0 0 6px}
.scta p{margin:0;opacity:.88}
.sbairros{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.sbairros button{display:grid;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;color:var(--ink)}
.sbairros button:hover{border-color:var(--accent)}
.sbairros b{font-family:var(--f-display);font-size:16px}
.sbairros span{color:var(--muted);font-size:13px}
.slinks{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.slinks a{border:1px solid var(--line);border-radius:999px;padding:8px 16px;color:var(--accent);text-decoration:none;font-weight:600;background:var(--bg)}
.sbread{padding-block:16px;font-size:13px;color:var(--muted)}
.sbread a{color:var(--accent);text-decoration:none}
.slist{display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:start;padding-bottom:48px}
.sfilt{position:sticky;top:90px}
.sfilt details>summary{font-family:var(--f-display);font-weight:800;font-size:18px;cursor:pointer;margin-bottom:10px;color:var(--accent)}
.sfilt .ssearch{box-shadow:none;border:1px solid var(--line)}
.sfilt .sfields{grid-template-columns:1fr}
.sfilt .sord{margin-top:12px}
.sres{min-width:0}
.sreshd{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sreshd h1{font-size:clamp(22px,2.6vw,30px);margin:0;color:var(--accent);margin-right:auto}
.sreshd>span{color:var(--muted)}
.sreshd .sord{min-width:160px}
.snote{color:var(--warn);font-weight:600;font-size:14px}
.sdet{display:grid;grid-template-columns:1fr 360px;gap:28px;align-items:start;padding-bottom:40px}
.sdmain{min-width:0}
.sgal{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:14px;overflow:hidden;background:var(--sunk)}
.sthumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.sthumbs button{flex:none;width:96px;height:68px;border:0;padding:0;border-radius:8px;overflow:hidden;cursor:pointer;background:var(--sunk)}
.sthumbs img{width:100%;height:100%;object-fit:cover}
.sdhd{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:14px 0}
.sdhd h1{font-size:clamp(22px,3vw,32px);margin:6px 0 4px;color:var(--ink)}
.sdact{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.sdact .sbtn{padding:8px 14px}
.sfeat.big{border:1px solid var(--line);border-radius:12px;padding:14px;gap:10px 22px;background:var(--surface)}
.sfeat.big span{display:grid;justify-items:center;gap:2px;font-size:12px;min-width:70px;text-align:center}
.sfeat.big b{font-family:var(--f-display);font-size:16px;color:var(--ink)}
.sdmain h2{font-size:20px;margin:26px 0 10px;color:var(--accent)}
.sdesc{white-space:pre-wrap;margin:0;max-width:70ch}
.sdside{display:grid;gap:16px;position:sticky;top:90px}
.sbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.sbox h3{margin:0 0 4px;font-size:18px;color:var(--accent)}
.sprice.big{font-size:30px;margin:2px 0 6px}
.smini{display:grid;gap:6px;margin:0}
.smini div{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:6px}
.smini dt{color:var(--muted)}.smini dd{margin:0;font-weight:600}
.sform{display:grid;gap:10px}
.s2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.smsg{margin:0;font-weight:600;font-size:14px}
.smsg.ok{color:var(--ok)}.smsg.bad{color:var(--bad)}
.spage{display:grid;grid-template-columns:1fr 400px;gap:32px;align-items:start;padding-bottom:48px}
.spage.one{grid-template-columns:1fr;max-width:820px}
.spage h1{font-size:clamp(26px,3.4vw,38px);color:var(--accent);margin:0 0 12px}
.spage p{font-size:16px;max-width:60ch}
.ssteps{display:grid;gap:14px;padding-left:20px;margin-top:20px}
.ssteps li b{display:block;font-family:var(--f-display)}
.sfoot{background:#0f1c3f;color:#d6def0;margin-top:20px}
.sfgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:28px;padding-block:44px}
.sfoot h4{font-family:var(--f-display);color:#fff;margin:0 0 10px;font-size:15px}
.sfoot a,.sfoot .linkbtn{display:block;color:#d6def0;text-decoration:none;padding:3px 0;font-size:14px}
.sfoot a:hover{color:var(--gold)}
.sfoot p{margin:0 0 6px;font-size:14px}
.sfabout img{height:56px;width:auto;margin-bottom:10px}
.sfabout .logo-l{display:none}.sfabout .logo-d{display:block}
.sfbase{border-top:1px solid rgba(255,255,255,.12);padding-block:14px;font-size:13px;color:#9fb0d0}
.sfbase .linkbtn{display:inline;color:var(--gold)}
.swa{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:#1f9d55;color:#fff;border-radius:999px;padding:10px 16px;display:flex;align-items:center;gap:8px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.25)}
@media (max-width:960px){
  .shgrid{grid-template-columns:1fr;padding-block:36px}
  .slist,.sdet,.spage{grid-template-columns:1fr}
  .sfilt,.sdside{position:static}
  .sfilt details:not([open])>summary{margin-bottom:0}
  .sfgrid{grid-template-columns:1fr 1fr}
}
@media (max-width:720px){
  .site{font-size:14px}
  .shbar{min-height:60px}
  .slogo img{height:40px}
  .sburger{display:block}
  .snav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--surface);border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch;padding:8px max(16px,env(safe-area-inset-left,0px)) 14px;box-shadow:0 12px 24px rgba(0,0,0,.12)}
  .snav.open{display:flex}
  .snav a{padding:12px 6px;border-bottom:1px solid var(--line)}
  .snav a.sbtn{margin:10px 0 0;border-bottom:0}
  .ssec{padding-block:32px}
  .sgrid{grid-template-columns:1fr}
  .sfields{grid-template-columns:1fr}
  .scta{padding:22px}
  .sfgrid{grid-template-columns:1fr}
  .swa span{display:none}
  .swa{padding:12px}
}

/* ---------- Portal do corretor ---------- */
header.top,nav.bnav{display:none!important}

.msgx{margin:0;white-space:pre-wrap}
.msga{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.slogin{display:grid;place-items:center;padding-block:56px 80px}
.plogin{width:100%;max-width:400px;text-align:left}
.plogin h1{margin:0;color:var(--accent);font-size:26px}
.plogin p{margin:0;color:var(--muted)}
.plogin label{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.plock{width:56px;height:56px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.pw{position:relative;display:block}
.pw input{padding-right:44px!important;width:100%}
.pweye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;border-radius:6px;display:grid;place-items:center}
.pweye:hover,.pweye[aria-pressed="true"]{color:var(--accent)}
.form .bad{border-color:var(--bad)!important;box-shadow:0 0 0 3px var(--bad-bg)}
.ferr{color:var(--bad);font-weight:600;font-size:12.5px}
#ferr{background:var(--bad-bg);color:var(--bad)!important;padding:10px 12px;border-radius:6px;font-weight:600}
.phint{font-size:13px;background:var(--sunk);padding:10px 12px;border-radius:8px}
@media (max-width:860px){
  .portal{grid-template-columns:1fr}
  .pside{position:fixed;left:0;top:0;bottom:0;width:min(280px,84vw);z-index:60;transform:translateX(-100%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .pside.open{transform:none}
  .menu-open .pscrim{display:block}
  .pscrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55}
  .pburger{display:block}
  .ptop{padding:10px 16px;top:env(safe-area-inset-top,0px)}
  .pcontent{padding:16px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
  .pwarn{padding:10px 16px}
  .puser small{display:none}
}

/* ---------- Celular ---------- */
nav.bnav{display:none}
@media (max-width:720px){
  body{font-size:15px}
  .top .bar{padding-block:8px}
  .top .wrap:last-child{display:none}
  .brand small{display:none}
  main{padding-block:16px calc(84px + env(safe-area-inset-bottom,0px))}
  .head{margin-bottom:12px}
  .head h1{font-size:22px}
  .head .btn{padding:8px 12px}
  nav.bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));overflow-x:auto;scrollbar-width:none}
  nav.bnav::-webkit-scrollbar{display:none}
  nav.bnav a{flex:1 0 64px;display:grid;justify-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:600;padding:4px 2px;border-radius:8px;white-space:nowrap}
  nav.bnav a svg{width:22px;height:22px}
  nav.bnav a[aria-current="page"]{color:var(--accent);background:var(--sunk)}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .filters input[type=search],.filters .chip,.filters .seg{grid-column:1/-1}
  .filters select{width:100%}
  .seg{display:flex}.seg button{flex:1}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .v{font-size:22px}
  .cols{grid-template-columns:1fr}
  .consulta{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr;gap:10px}
  .card{flex-direction:row}
  .card .ph{width:118px;flex:none;aspect-ratio:auto;min-height:118px}
  .card .ph .tags{left:4px;top:4px}
  .card .ph .tags .pill:not(:first-child){display:none}
  .card .ph .ilus{font-size:9px;right:4px;bottom:4px;padding:1px 6px}
  .card .body{padding:10px 12px;min-width:0}
  .card h3{font-size:14px}
  .card .price{font-size:16px}
  .vitrine-grid .card{flex-direction:column}
  .vitrine-grid .card .ph{width:auto;aspect-ratio:4/3}
  .tbl{background:none;border:0;overflow:visible}
  .tbl table{min-width:0}
  .tbl thead{display:none}
  .tbl table,.tbl tbody,.tbl tr,.tbl td{display:block}
  .tbl tr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:10px}
  .tbl td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
  .tbl td::before{content:attr(data-label);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding-top:2px}
  .tbl td:first-child{display:block;text-align:left;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .tbl td:first-child::before{content:none}
  .tbl td small{display:block}
  tbody tr:hover td{background:none}
  .kanban{grid-template-columns:repeat(6,82vw);scroll-snap-type:x mandatory;margin-inline:-4px}
  .col{scroll-snap-align:start}
  .ov{padding:0;align-items:stretch}
  .modal{max-width:none;border-radius:0;border:0;min-height:100%;display:flex;flex-direction:column}
  .modal .mh{position:sticky;top:0;background:var(--surface);z-index:2;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .modal .mb{flex:1;padding:16px}
  .modal .mf{position:sticky;bottom:0;background:var(--surface);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .form input,.form select,.form textarea{font-size:16px;padding:10px 12px}
  .gal{grid-template-columns:1fr 1fr}
  .vhero{padding:20px 18px}
  .psearch input{font-size:16px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 14px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
@media (prefers-reduced-motion:no-preference){.card,.btn{transition:border-color .15s,filter .15s}}
</style>

/* ---------- Derived ---------- */
function contratoInfo(c){
  const fimD = daysTo(c.fim);
  let reaj = null;
  if (c.inicio) {
    const ini = new Date(c.inicio + "T00:00:00"); const t = today();
    let r = new Date(t.getFullYear(), ini.getMonth(), ini.getDate());
    if (r < t) r = new Date(t.getFullYear()+1, ini.getMonth(), ini.getDate());
    if (r.getFullYear() - ini.getFullYear() >= 1) reaj = r;
  }
  const reajD = reaj ? Math.round((reaj - today())/864e5) : null;
  return {fimD, reaj, reajD};
}
function alerts(){
  const out = [];
  S.data.contratos.filter(c => c.status !== "Encerrado").forEach(c => {
    const im = byId("imoveis", c.imovelId); const i = contratoInfo(c);
    if (i.fimD != null && i.fimD < 0) out.push({lvl:"bad", t:`Contrato vencido há ${-i.fimD} dias`, s:`${c.inquilino} · ${imLabel(im)}`, id:c.id, col:"contratos"});
    else if (i.fimD != null && i.fimD <= 60) out.push({lvl:"warn", t:`Contrato termina em ${i.fimD} dias`, s:`${c.inquilino} · ${imLabel(im)}`, id:c.id, col:"contratos"});
    if (i.reajD != null && i.reajD <= 30) out.push({lvl:"info", t:`Reajuste (${c.indice||"índice"}) em ${i.reajD} dias`, s:`${c.inquilino} · ${fdate(i.reaj.toISOString())}`, id:c.id, col:"contratos"});
  });
  return out;
}

/* ---------- Busca inteligente ---------- */
const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const SMART = (() => {
  const NUM = String.raw`(\d+(?:[.,]\d+)*)\s*(milhoes|milhao|mil|mi|k)?`;
  const money = (n, u) => { let v = parseFloat(n.replace(/\.(?=\d{3}\b)/g, "").replace(",", ".")); if (/^milh|^mi$/.test(u || "")) v *= 1e6; else if (/^(mil|k)$/.test(u || "")) v *= 1e3; return v; };
  const TIPO_WORDS = [
    [/\b(apartamentos?|aptos?|ap)\b/, ["Apartamento","Cobertura"], "Apartamento"],
    [/\bcoberturas?\b/, ["Cobertura"], "Cobertura"],
    [/\b(casas? em condominio|condominio fechado)\b/, ["Casa em condomínio"], "Casa em condomínio"],
    [/\bcasas?\b/, ["Casa","Casa em condomínio"], "Casa"],
    [/\b(lotes?|loteamentos?)\b/, ["Lote","Terreno"], "Lote/terreno"],
    [/\bterrenos?\b/, ["Terreno","Lote"], "Terreno"],
    [/\b(salas? comerciais?|salas? comercial|sala)\b/, ["Sala comercial"], "Sala comercial"],
    [/\blojas?\b/, ["Loja"], "Loja"],
    [/\bgalpo?(es|ao)\b/, ["Galpão"], "Galpão"],
    [/\b(fazendas?|sitios?|chacaras?)\b/, ["Fazenda/Sítio"], "Fazenda/Sítio"],
  ];
  const FEATS = [["piscina","piscina"],["varanda gourmet","varanda gourmet"],["varanda","varanda"],["gourmet","gourmet"],["churrasqueira","churrasqueira"],["energia solar","energia solar"],["solar","solar"],["closet","closet"],["quintal","quintal"],["edicula","edícula"],["jardim","jardim"],["esquina","esquina"],["duplex","duplex"],["sobrado","sobrado"],["colonial","colonial"],["terrea","térrea"],["geminada","geminada"],["condominio","condomínio"],["planejad","cozinha planejada"],["portao eletronico","portão eletrônico"]];
  const STOP = new Set("de da do das dos com em no na nos nas e ate para pra a o as os um uma ou mais que quero procuro preciso tem bairro valor reais preco por ao".split(" "));

  function parse(q, bairros){
    const c = {fin:null, tipos:null, tipoLbl:null, bairros:[], qmin:null, smin:null, vmin:null, bmin:null, amin:null, pmin:null, pmax:null, feats:[], txt:[]};
    let t = " " + norm(q).replace(/r\$\s*/g, " ").replace(/[;|]/g, ",") + " ";
    const cut = re => { const m = t.match(re); if (m) t = t.replace(m[0], " , "); return m; };
    let m;
    if ((m = cut(/\b(venda|vender|vendo|comprar|compra|a venda)\b/))) c.fin = "Venda";
    if ((m = cut(/\b(aluguel|alugar|aluga|locacao|locar|alugo)\b/))) c.fin = "Locação";
    if ((m = cut(/\b(\d)\s*\/\s*4\b/))) c.qmin = +m[1];
    if ((m = cut(/\b(\d+)\s*(quartos?|qtos?|qts?|dormitorios?|dorms?)\b/))) c.qmin = +m[1];
    if ((m = cut(/\b(\d+)\s*(suites?)\b/))) c.smin = +m[1];
    if ((m = cut(/\b(\d+)\s*(vagas?|garagens?)\b/))) c.vmin = +m[1];
    if ((m = cut(/\b(\d+)\s*(banheiros?|wcs?)\b/))) c.bmin = +m[1];
    if ((m = cut(/\b(\d+)\s*(m2|m²|metros?)\b/))) c.amin = +m[1];
    const range = cut(new RegExp(String.raw`entre\s+${NUM}\s+(?:e|a)\s+${NUM}`));
    if (range) { let a = money(range[1], range[2] || range[4]), b = money(range[3], range[4]); c.pmin = Math.min(a,b); c.pmax = Math.max(a,b); }
    if ((m = cut(new RegExp(String.raw`(?:acima de|a partir de|minimo|min|mais de)\s+${NUM}`)))) c.pmin = money(m[1], m[2]);
    if ((m = cut(new RegExp(String.raw`(?:ate|max|maximo|menos de|no maximo)\s+${NUM}`)))) c.pmax = money(m[1], m[2]);
    if (c.pmax == null && (m = cut(new RegExp(String.raw`(?:^|[\s,])${NUM}(?=[\s,])`)))) {
      let v = money(m[1], m[2]);
      if (!m[2] && v < 1000 && c.fin !== "Locação") v *= 1000;
      if (v >= 300) c.pmax = v;
    }
    for (const [re, tipos, lbl] of TIPO_WORDS) if (!c.tipos && (m = cut(re))) { c.tipos = tipos; c.tipoLbl = lbl; }
    if ((m = cut(/\bsuites?\b/))) c.smin = c.smin || 1;
    for (const b of [...bairros].sort((x,y)=>y.length-x.length)) { const nb = norm(b); const re = new RegExp(String.raw`(^|[\s,])${nb.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}(?=[\s,]|$)`); if (re.test(t)) { c.bairros.push(b); t = t.replace(re, " , "); } }
    for (const [k, lbl] of FEATS) if (t.includes(k)) { c.feats.push([k, lbl]); t = t.split(k).join(" , "); }
    c.txt = t.split(/[\s,]+/).filter(w => w && !STOP.has(w) && w.length > 1);
    return c;
  }
  const priceOf = (i, fin) => fin === "Locação" ? n0(i.valorAluguel) : fin === "Venda" ? n0(i.valorVenda) : (n0(i.valorVenda) || n0(i.valorAluguel));
  function match(i, c, relax = {}){
    if (c.fin && !(i.finalidade || "").includes(c.fin)) return false;
    if (c.tipos && !c.tipos.includes(i.tipo)) return false;
    if (!relax.bairro && c.bairros.length && !c.bairros.includes(i.bairro)) return false;
    if (c.qmin && n0(i.quartos) < c.qmin) return false;
    if (c.smin && n0(i.suites) < c.smin) return false;
    if (c.vmin && n0(i.vagas) < c.vmin) return false;
    if (c.bmin && n0(i.banheiros) < c.bmin) return false;
    if (c.amin && n0(i.area) < c.amin) return false;
    if (!relax.price) {
      const p = priceOf(i, c.fin);
      if (c.pmax != null && !(p > 0 && p <= c.pmax * (relax.tol || 1))) return false;
      if (c.pmin != null && !(p >= c.pmin)) return false;
    }
    if (c.feats.length) { const hay = norm([i.titulo, i.descricao, i.tipo].join(" ")); if (!c.feats.every(([k]) => hay.includes(k))) return false; }
    if (c.txt.length) { const hay = norm([i.codigo, i.titulo, i.bairro, i.cidade, i.endereco, i.loteamento, i.descricao, byId("proprietarios", i.proprietarioId)?.nome].join(" ")); if (!c.txt.every(w => hay.includes(w))) return false; }
    return true;
  }
  const mil = v => v >= 1e6 ? (v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:2}) + " milhão" : v >= 1000 ? (v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1}) + " mil" : String(v);
  function chips(c){
    const o = [];
    if (c.fin) o.push(c.fin === "Venda" ? "Venda" : "Aluguel");
    if (c.tipoLbl) o.push(c.tipoLbl);
    c.bairros.forEach(b => o.push(b));
    if (c.qmin) o.push(`${c.qmin}+ quartos`);
    if (c.smin) o.push(`${c.smin}+ suíte${c.smin>1?"s":""}`);
    if (c.vmin) o.push(`${c.vmin}+ vaga${c.vmin>1?"s":""}`);
    if (c.bmin) o.push(`${c.bmin}+ banheiros`);
    if (c.amin) o.push(`${c.amin}+ m²`);
    if (c.pmin != null && c.pmax != null) o.push(`R$ ${mil(c.pmin)} a ${mil(c.pmax)}`);
    else if (c.pmax != null) o.push(`até R$ ${mil(c.pmax)}`);
    else if (c.pmin != null) o.push(`a partir de R$ ${mil(c.pmin)}`);
    c.feats.forEach(([,l]) => o.push(l));
    c.txt.forEach(w => o.push(`“${w}”`));
    return o;
  }
  /* Procura; se não achar nada exato, afrouxa preço (+15%), depois ignora preço, depois ignora bairro */
  function run(list, q){
    const bairros = [...new Set(S.data.imoveis.map(i => i.bairro).filter(Boolean))];
    const c = parse(q, bairros);
    const sortBy = arr => c.pmax != null ? arr.sort((a,b) => Math.abs(priceOf(a,c.fin) - c.pmax) - Math.abs(priceOf(b,c.fin) - c.pmax)) : arr;
    let res = list.filter(i => match(i, c)); let note = "";
    if (!res.length) {
      const steps = [[{tol:1.15}, "Nada exato. Mostrando opções até 15% acima do valor."], [{price:1}, "Nada nessa faixa de preço. Mostrando as opções mais próximas do valor."], [{price:1, bairro:1}, "Nada nesse bairro. Mostrando opções em outros bairros."]];
      for (const [r, n] of steps) { if ((r.tol || r.price) && c.pmax == null && c.pmin == null) continue; if (r.bairro && !c.bairros.length) continue; res = list.filter(i => match(i, c, r)); if (res.length) { note = n; break; } }
    }
    let alt = [];
    if (note && c.bairros.length && (c.pmax != null || c.pmin != null)) alt = sortBy(list.filter(i => match(i, c, {bairro:1}) && !c.bairros.includes(i.bairro)));
    return {c, res: sortBy(res), alt, note, chips: chips(c), priceOf};
  }
  return {run, priceOf};
})();
function smartChips(sr){ return sr.chips.length ? `<div class="smartbar"><span class="lbl">Entendi</span>${sr.chips.map(x=>`<span class="chip sm">${esc(x)}</span>`).join("")}${sr.note ? `<span class="smartnote">${esc(sr.note)}</span>` : ""}</div>` : ""; }

function stPill(s){ const m={"Disponível":"ok","Reservado":"warn","Alugado":"info","Vendido":"info","Inativo":""}; return `<span class="pill ${m[s]||""}">${esc(s||"—")}</span>`; }
function specs(im){
  const p = [];
  if (im.quadra || im.lote) p.push([im.quadra?`Qd ${im.quadra}`:"", im.lote?`Lt ${im.lote}`:""].filter(Boolean).join(" "));
  if (im.area) p.push(`${im.area} m²`);
  if (im.quartos) p.push(`${im.quartos} qto${im.quartos>1?"s":""}`);
  if (im.suites) p.push(`${im.suites} suíte${im.suites>1?"s":""}`);
  if (im.vagas) p.push(`${im.vagas} vaga${im.vagas>1?"s":""}`);
  return p.join(" · ");
}
function priceHtml(im, fin){
  const f = fin || im.finalidade || "";
  const out = [];
  if (f.includes("Venda") && im.valorVenda) out.push(`<div class="price">${money(im.valorVenda)}</div>`);
  if (f.includes("Locação") && im.valorAluguel) out.push(`<div class="price">${money(im.valorAluguel)} <small>/mês</small></div>`);
  return out.join("") || `<div class="price"><small>Consulte</small></div>`;
}

async function doLogin(u, p){
  if (window.M2_AUTH) return window.M2_AUTH.login(u, p);
  u = norm(u).replace(/\s+/g, "");
  const users = S.data.usuarios;
  if (!users.length) { if (u === "admin" && p === "m2admin") return {nome:"Administrador", perfil:"Administrador", padrao:true}; return null; }
  const x = users.find(z => norm(z.usuario).replace(/\s+/g, "") === u && z.ativo !== false);
  if (!x || !x.senhaHash || x.senhaHash !== await sha(p)) return null;
  return {id:x.id, nome:x.nome, perfil:x.perfil || "Corretor"};
}

async function convertCapt(id){
  const c = byId("captacoes", id); if (!c) return;
  try {
    const now = new Date().toISOString();
    const prop = await S.db.collection("proprietarios").add({nome:c.propNome||"Proprietário", telefone:c.propTelefone||"", email:c.propEmail||"", obs:"Cadastrado a partir da captação", criadoEm:now});
    const fin = c.finalidade === "Alugar" ? "Locação" : c.finalidade === "Vender ou alugar" ? "Venda e Locação" : "Venda";
    const v = n0(c.valorAvaliado) || n0(c.valorPretendido) || null;
    const codigo = nextCode();
    const im = await S.db.collection("imoveis").add({codigo, titulo:`${c.tipo||"Imóvel"}${c.bairro ? " no " + c.bairro : ""}`, finalidade:fin, tipo:c.tipo||"Casa", status:"Disponível",
      proprietarioId:prop.id, endereco:c.endereco||"", bairro:c.bairro||"", cidade:"Parnaíba", area:c.area||null, quartos:c.quartos||null, vagas:c.vagas||null,
      valorVenda: fin.includes("Venda") ? v : null, valorAluguel: fin === "Locação" ? v : null, descricao:"", fotos:[], publicar:false, destaque:false, criadoEm:now});
    await S.db.collection("captacoes").doc(id).update({status:"Captado", imovelId:im.id});
    toast(`Imóvel ${codigo} criado fora do site. Complete fotos e descrição.`);
  } catch (e) { toast("Não foi possível criar o imóvel"); }
}

/* eventos do portal */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-mread],[data-mresp],[data-mf],[data-cconv]"); if (!t) return;
  if (t.dataset.mf) { S.mf = t.dataset.mf; return render(); }
  if (t.dataset.mread) { const m = byId("mensagens", t.dataset.mread); return S.db.collection("mensagens").doc(m.id).update({lida: !m.lida}).catch(() => toast("Não foi possível alterar")); }
  if (t.dataset.mresp) { const m = byId("mensagens", t.dataset.mresp); return S.db.collection("mensagens").doc(m.id).update({respondida: !m.respondida, lida: true, respondidaPor: S.sess?.nome || ""}).catch(() => toast("Não foi possível alterar")); }
  if (t.dataset.cconv) { t.disabled = true; return convertCapt(t.dataset.cconv); }
});
document.addEventListener("change", e => {
  if (e.target.dataset.cst) return S.db.collection("captacoes").doc(e.target.dataset.cst).update({status: e.target.value}).catch(() => toast("Não foi possível mudar a situação"));
  if (e.target.id === "ffst") { S.ff = e.target.value; render(); }
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-pw]"); if (!b) return;
  const inp = b.parentElement.querySelector("input"); const show = inp.type === "password";
  inp.type = show ? "text" : "password"; b.setAttribute("aria-pressed", show); b.setAttribute("aria-label", show ? "Ocultar senha" : "Mostrar senha"); b.title = b.getAttribute("aria-label"); inp.focus();
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "loginf") return;
  e.preventDefault();
  const err = $("#lg_err"); const btn = e.target.querySelector("button[type=submit]"); err.hidden = true; btn.disabled = true; btn.textContent = "Entrando…";
  let s = null; try { s = await doLogin($("#lg_u").value, $("#lg_p").value); } catch (x) { err.hidden = false; err.textContent = x.message || "Não foi possível entrar."; }
  btn.disabled = false; btn.textContent = "Entrar";
  if (!s) { if (err.hidden) { err.hidden = false; err.textContent = "Usuário ou senha incorretos."; } return; }
  if (window.M2_AUTH) { history.replaceState(null, "", "#painel"); location.reload(); return; }
  setSess(s); location.hash = "painel";
});

function mapInfo(im, internal){
  const c = (im.coordenadas || "").replace(/\s/g, "");
  const exact = /^-?\d+(\.\d+)?,-?\d+(\.\d+)?$/.test(c);
  const q = exact ? c : [internal ? im.endereco : null, im.loteamento, im.bairro, im.cidade].filter(Boolean).join(", ");
  const e = encodeURIComponent(q);
  return {exact, q, sat:`https://maps.google.com/maps?q=${e}&t=k&z=18`, map:`https://www.google.com/maps/search/?api=1&query=${e}`};
}
function mapBlock(im, internal){

  openModal(`<form id="frm" novalidate><div class="mh"><div><span class="lbl">${isNew ? "Novo cadastro" : esc(d.codigo || "Editar")}</span><h2>${isNew ? "Novo " + sc.one : esc(d.titulo || d.nome || d.inquilino || "Editar " + sc.one)}</h2></div><button type="button" class="x" aria-label="Fechar" data-act="close">×</button></div>
    <div class="mb"><div class="form">${sc.fields.map(f=>fieldHtml(f,d)).join("")}</div><p id="ferr" style="color:var(--bad);margin:12px 0 0" hidden></p></div>
    <div class="mf">${!isNew ? `<button type="button" class="btn danger" id="del">Excluir</button>` : ""}<div class="r"><button type="button" class="btn" data-act="close">Cancelar</button><button type="submit" class="btn pri" id="save">${isNew ? "Cadastrar" : "Salvar"}</button></div></div></form>`,
  ov => {
    const drawPhotos = () => { const box = $("#photos", ov); if (!box) return;
      box.innerHTML = fotos.map((f,i)=>`<div class="th"><img src="${photoUrl(f)}" alt="Foto ${i+1}"><button type="button" data-rmph="${i}" aria-label="Remover foto ${i+1}">×</button></div>`).join("") + (uploading ? `<div class="add">Enviando ${uploading}…</div>` : "") + `<button type="button" class="add" id="addPh">+ Adicionar fotos</button>`; };
    drawPhotos();
    ov.addEventListener("click", e => {
      if (e.target.id === "addPh") $("#fileIn", ov).click();
      const rm = e.target.dataset.rmph; if (rm !== undefined) { fotos.splice(+rm,1); drawPhotos(); }
      if (e.target.id === "del") {
        if (!delArm) { delArm = true; e.target.textContent = "Confirmar exclusão"; return; }
        S.db.collection(col).doc(d.id).delete().then(()=>{ closeModal(); toast("Excluído"); }).catch(err => showErr(err));
      }
    });
    const fi = $("#fileIn", ov);
    fi && fi.addEventListener("change", async () => {
      const files = [...fi.files]; fi.value = ""; uploading += files.length; drawPhotos();
      for (const file of files) {
        try { const r = await S.assets.upload(file); fotos.push(r.id); }
        catch (err) { showErr({message: "Não foi possível enviar " + file.name + ": " + (err.message||err.code)}); }
        uploading--; drawPhotos();
      }
    });
    function showErr(err, field){
      const msg = err.code === "permission_denied" ? "Você não tem permissão para alterar o banco." : (err.message || "Não foi possível salvar. Tente de novo.");
      const p = $("#ferr", ov); p.hidden = false; p.textContent = msg;
      if (field) { field.classList.add("bad"); const box = field.closest(".f"); if (box && !box.querySelector(".ferr")) box.insertAdjacentHTML("beforeend", `<small class="ferr" role="alert">${esc(msg)}</small>`); field.scrollIntoView({block:"center"}); field.focus(); }
      else p.scrollIntoView({block:"center"});
      toast(msg);
    }
    function clearErr(){ ov.querySelectorAll(".bad").forEach(x => x.classList.remove("bad")); ov.querySelectorAll(".ferr").forEach(x => x.remove()); $("#ferr", ov).hidden = true; }
    $("#frm", ov).addEventListener("submit", async e => {
      e.preventDefault();
      clearErr();
      if (uploading) return showErr({message:"Aguarde o envio das fotos terminar."});
      const out = {};
      for (const f of sc.fields) { if (!f.k) continue; const el = ov.querySelector(`[name="${f.k}"]`);
        if (f.t === "photos") { out.fotos = fotos; continue; }
        if (f.t === "password") {
          const el2 = ov.querySelector(`[name="${f.k}2"]`); const p1 = el ? el.value : "", p2 = el2 ? el2.value : "";
          if (!p1 && !p2) { if (isNew) return showErr({message:"Defina uma senha para o novo usuário."}, el); continue; }
          if (p1.length < 6) return showErr({message:"A senha precisa ter pelo menos 6 caracteres."}, el);
          if (!p2) return showErr({message:"Confirme a senha digitando-a de novo."}, el2);
          if (p1 !== p2) return showErr({message:"As senhas não conferem. Digite a mesma senha nos dois campos."}, el2);
          if (window.M2_AUTH) out._senha = p1; else out.senhaHash = await sha(p1); continue;
        }
        if (!el) continue;
        let v = f.t === "bool" ? el.checked : el.value.trim();
        if (f.t === "num") v = v === "" ? null : +v;
        if (f.up && typeof v === "string") v = v.toLocaleUpperCase("pt-BR");
        if (f.req && (v === "" || v == null)) return showErr({message:`Preencha o campo “${f.l}”.`}, el);
        out[f.k] = v; }
      if (col === "usuarios") { out.usuario = norm(out.usuario).replace(/\s+/g, ""); if (S.data.usuarios.some(u => u.usuario === out.usuario && u.id !== d.id)) return showErr({message:"Já existe alguém com esse usuário. Escolha outro."}, ov.querySelector('[name="usuario"]')); }
      const btn = $("#save", ov); btn.disabled = true; btn.textContent = "Salvando…";
      try {
        if (col === "usuarios" && window.M2_AUTH) {
          if (isNew) await window.M2_AUTH.createUser(out); else await window.M2_AUTH.updateUser(d.id, out, d);
          closeModal(); toast(isNew ? "Usuário cadastrado" : "Alterações salvas"); return;
        }
        if (isNew) {
          out.criadoEm = new Date().toISOString();
          if (col === "imoveis") out.codigo = nextCode();
          await S.db.collection(col).add(out);
        } else {
          await S.db.collection(col).doc(d.id).update(out);
        }
        if (col === "contratos" && out.status === "Ativo") { const im = byId("imoveis", out.imovelId); if (im && im.status !== "Alugado") await S.db.collection("imoveis").doc(im.id).update({status:"Alugado"}); }
        closeModal(); toast(isNew ? "Cadastrado" : "Alterações salvas");
      } catch (err) { btn.disabled = false; btn.textContent = isNew ? "Cadastrar" : "Salvar"; showErr(err, err && err.field ? ov.querySelector(`[name="${err.field}"]`) : null); }
    });
  });
}
function nextCode(){ const mx = S.data.imoveis.reduce((m,i)=>Math.max(m, parseInt((i.codigo||"").replace(/\D/g,""))||0), 0); return "M2-" + String(mx+1).padStart(4,"0"); }

function openCfg(){
  const c = S.cfg;
  openModal(`<form id="cfgf"><div class="mh"><h2>Dados da imobiliária</h2><button type="button" class="x" aria-label="Fechar" data-act="close">×</button></div>
  <div class="mb"><div class="form">
    <div class="f c3"><label for="c_nome">Nome na vitrine</label><input id="c_nome" value="${esc(c.nome||"M2 Imóveis")}"></div>
    <div class="f c3"><label for="c_creci">CRECI</label><input id="c_creci" value="${esc(c.creci||"")}"></div>
    <div class="f c3"><label for="c_wa">WhatsApp de atendimento</label><input id="c_wa" value="${esc(c.whatsapp||"")}" placeholder="(00) 00000-0000"></div>
    <div class="f c3"><label for="c_tel">Telefone</label><input id="c_tel" value="${esc(c.telefone||"")}"></div>
    <div class="f c3"><label for="c_email">E-mail</label><input id="c_email" type="email" value="${esc(c.email||"")}"></div>
    <div class="f"><label for="c_end">Endereço</label><input id="c_end" value="${esc(c.endereco||"")}"></div>
    <div class="f"><label for="c_slogan">Título do site</label><input id="c_slogan" value="${esc(c.slogan||"")}" placeholder="Encontre seu imóvel em Parnaíba com a M2"></div>
  </div></div><div class="mf"><div class="r"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn pri">Salvar</button></div></div></form>`, ov => {
    $("#cfgf", ov).addEventListener("submit", async e => { e.preventDefault();
      const data = {nome:$("#c_nome").value.trim(), creci:$("#c_creci").value.trim(), whatsapp:$("#c_wa").value.trim(), slogan:$("#c_slogan").value.trim(), telefone:$("#c_tel").value.trim(), email:$("#c_email").value.trim(), endereco:$("#c_end").value.trim()};
      try { await S.db.doc("config/empresa").set(data); closeModal(); toast("Dados salvos"); } catch(err){ toast("Não foi possível salvar"); }
    });
  });
}

/* ---------- Exemplos ---------- */
async function seed(){
  const db = S.db; const now = new Date(); const iso = d => d.toISOString().slice(0,10);
  const addM = (m, d=0) => { const x = new Date(now); x.setMonth(x.getMonth()+m); x.setDate(x.getDate()+d); return x; };
  const E = {exemplo:true, criadoEm:now.toISOString()};
  const p1 = await db.collection("proprietarios").add({...E, nome:"Helena Duarte (exemplo)", documento:"000.000.000-00", telefone:"(00) 90000-0001", email:"helena@exemplo.com", repasse:"Pix: e-mail"});
  const p2 = await db.collection("proprietarios").add({...E, nome:"Construtora Horizonte (exemplo)", documento:"00.000.000/0001-00", telefone:"(00) 3000-0002"});
  const i1 = await db.collection("imoveis").add({...E, codigo:"M2-0001", titulo:"Apartamento 3 quartos com varanda gourmet", finalidade:"Venda", tipo:"Apartamento", status:"Disponível", proprietarioId:p1.id, bairro:"Centro", cidade:"", area:98, quartos:3, suites:1, banheiros:2, vagas:2, valorVenda:620000, condominio:780, iptu:1900, descricao:"Nascente, andar alto, varanda gourmet integrada à sala. Prédio com piscina e academia.", publicar:true, destaque:true, fotos:[]});
  const i2 = await db.collection("imoveis").add({...E, codigo:"M2-0002", titulo:"Casa térrea com quintal", finalidade:"Locação", tipo:"Casa", status:"Alugado", proprietarioId:p1.id, bairro:"Jardim das Flores", area:140, quartos:3, banheiros:2, vagas:2, valorAluguel:3200, iptu:1200, publicar:false, fotos:[]});
  const i3 = await db.collection("imoveis").add({...E, codigo:"M2-0003", titulo:"Sala comercial de 40 m² perto do fórum", finalidade:"Venda e Locação", tipo:"Sala comercial", status:"Disponível", proprietarioId:p2.id, bairro:"Centro", area:40, banheiros:1, vagas:1, valorVenda:240000, valorAluguel:1800, condominio:450, publicar:true, fotos:[]});
  await db.collection("imoveis").add({...E, codigo:"M2-0004", titulo:"Terreno plano de 360 m² em condomínio", finalidade:"Venda", tipo:"Terreno", status:"Reservado", proprietarioId:p2.id, bairro:"Alphaville", area:360, valorVenda:290000, publicar:true, fotos:[]});
  await db.collection("contratos").add({...E, imovelId:i2.id, inquilino:"Marcos Teixeira (exemplo)", telInquilino:"(00) 90000-0003", valor:3200, diaVencimento:5, taxaAdm:10, inicio:iso(addM(-11,10)), fim:iso(addM(1,10)), indice:"IGP-M", garantia:"Seguro fiança", status:"Ativo"});
  const l1 = await db.collection("leads").add({...E, nome:"Patrícia Lima (exemplo)", telefone:"(00) 90000-0004", origem:"Instagram", interesse:"Comprar", tipoDesejado:"Apartamento", orcamento:650000, bairros:"Centro", imovelId:i1.id, etapa:"Visita agendada", corretor:"Ana"});
  await db.collection("leads").add({...E, nome:"Rafael Souza (exemplo)", telefone:"(00) 90000-0005", origem:"WhatsApp", interesse:"Alugar", tipoDesejado:"Sala comercial", orcamento:2000, imovelId:i3.id, etapa:"Novo", corretor:"Bruno"});
  await db.collection("leads").add({...E, nome:"Juliana Prado (exemplo)", origem:"Portal", interesse:"Comprar", tipoDesejado:"Terreno", orcamento:300000, etapa:"Proposta", corretor:"Ana"});
  const vd = new Date(now); vd.setDate(vd.getDate()+2); vd.setHours(10,0,0,0);
  const pad = x => String(x).padStart(2,"0"); const loc = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  await db.collection("visitas").add({...E, imovelId:i1.id, leadId:l1.id, data:loc(vd), corretor:"Ana", status:"Agendada"});
  toast("Exemplos carregados");
}
async function unseed(){
  for (const col of Object.keys(S.data)) for (const d of S.data[col].filter(x=>x.exemplo)) { try { await S.db.collection(col).doc(d.id).delete(); } catch {} }
  toast("Exemplos apagados");
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-new],[data-open],[data-edit],[data-act],[data-newfor],[data-vfin],[data-cat],[data-clearcat]"); if (!t) return;
  if (t.dataset.cat) { S.f = {q:"", fin:"", st:"Disponível", tipo:"", cat:t.dataset.cat, lot:""}; if (location.hash === "#imoveis") render(); else location.hash = "imoveis"; return; }
  if (t.dataset.clearcat) { S.f.cat = ""; S.f.lot = ""; return render(); }
  if (t.dataset.new) return openForm(t.dataset.new);
  if (t.dataset.newfor) { const col = t.dataset.newfor; closeModal(); return openForm(col, null, {imovelId:t.dataset.im}); }
  if (t.dataset.edit) { const d = byId(t.dataset.edit, t.dataset.id); closeModal(); return openForm(t.dataset.edit, d); }
  if (t.dataset.open) { const col = t.dataset.open; closeModal(); return col === "imoveis" ? showDetail(col, t.dataset.id, !!t.dataset.pub) : (S.canWrite ? openForm(col, byId(col, t.dataset.id)) : null); }
  if (t.dataset.vfin !== undefined) { S.v.fin = t.dataset.vfin; return render(); }
  const a = t.dataset.act;
  if (a === "close") closeModal();
  if (a === "logout") { if (window.M2_AUTH) { window.M2_AUTH.logout().then(() => { history.replaceState(null, "", "#vitrine"); location.reload(); }); return; } setSess(null); location.hash = "vitrine"; return; }
  if (a === "resetpw") { const u = $("#lg_u").value; const err = $("#lg_err"); err.hidden = false;
    if (!u.trim()) { err.textContent = "Digite seu usuário ou e-mail e clique de novo em “Esqueci minha senha”."; $("#lg_u").focus(); return; }
    window.M2_AUTH.reset(u).then(em => { err.className = "smsg ok"; err.textContent = `Enviamos um link para ${em}. Abra o e-mail para criar uma nova senha.`; }, x => { err.className = "smsg bad"; err.textContent = x.message; }); return; }
  if (a === "pmenu") { $("#pside")?.classList.toggle("open"); $(".portal")?.classList.toggle("menu-open"); return; }
  if (a === "seed") { t.disabled = true; seed().catch(()=>toast("Não foi possível carregar os exemplos")); }
  if (a === "unseed") { t.disabled = true; unseed(); }
  if (a === "cfg") openCfg();
});
document.addEventListener("input", e => {
  if (e.target.dataset && e.target.dataset.up) { const el = e.target, a = el.selectionStart, b = el.selectionEnd; el.value = el.value.toLocaleUpperCase("pt-BR"); try { el.setSelectionRange(a, b); } catch (x) {} return; }
  const id = e.target.id;
  if (id === "lq") { S.lf.q = e.target.value; const pos = e.target.selectionStart; render(); const el = $("#lq"); el.focus(); el.setSelectionRange(pos,pos); return; }
  if (id === "vq") { S.v.q = e.target.value; const pos = e.target.selectionStart; render(); const el = $("#vq"); el.focus(); el.setSelectionRange(pos,pos); return; }
  if (id === "fq") { S.f.q = e.target.value; const pos = e.target.selectionStart; render(); const el = $("#fq"); el.focus(); el.setSelectionRange(pos,pos); }
});
document.addEventListener("change", e => {
  const id = e.target.id, v = e.target.value;
  if (id === "let") { S.lf.et = v; return render(); }
  if (id === "lor") { S.lf.or = v; return render(); }
  if (id === "flot") S.f.lot = v; else if (id === "ffin") S.f.fin = v; else if (id === "fst") S.f.st = v; else if (id === "ftipo") S.f.tipo = v;
  else if (id === "vtipo") S.v.tipo = v; else if (id === "vbairro") S.v.bairro = v;
  else if (e.target.dataset.etapa) { S.db.collection("leads").doc(e.target.dataset.etapa).update({etapa:v}).catch(()=>toast("Não foi possível mudar a etapa")); return; }
  else return;
  render();
});

document.addEventListener("submit", e => {
  if (e.target.id !== "psearch") return;
  e.preventDefault();
  S.f = {q: $("#pq").value, fin:"", st:"Disponível", tipo:"", cat:"", lot:""};
  if (location.hash === "#imoveis") render(); else location.hash = "imoveis";
});

/* ---------- Boot ---------- */
render();
(async () => {
  const claude = window.claude;
  if (window.M2_FAIL) { $("#view").innerHTML = `<div class="emptybox" style="margin:40px 16px"><b>Sistema fora do ar</b><span>${esc(window.M2_FAIL)}</span></div>`; return; }
  if (!claude?.use) { $("#view").innerHTML = `<div class="emptybox"><b>Banco de dados indisponível</b><span>Abra esta página pelo link do Claude para acessar os imóveis da M2.</span></div>`; return; }
  const [db, user, assets] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("assets")]);
  S.db = db; S.user = user; S.assets = assets;
  if (!db) { $("#view").innerHTML = `<div class="emptybox"><b>Entre na sua conta para ver os imóveis</b><span>O banco de imóveis da M2 só abre para quem está conectado.</span></div>`; return; }
  const cw = user ? user.can("data.write") : null;
  S.canWrite = cw !== false;
  S.internal = S.canWrite;
  if (window.M2_AUTH) S.sess = window.M2_AUTH.session();
  const cols = Object.keys(S.data);
  let pending = new Set(cols);
  let rT;
  const schedule = () => { clearTimeout(rT); rT = setTimeout(() => { if (!$("#ov")) render(); else S.dirty = true; }, 60); };
  cols.forEach(col => {
    if (!S.internal && col !== "imoveis") { pending.delete(col); return; }
    db.collection(col).onSnapshot(snap => {
      S.data[col] = snap.docs.map(d => ({id:d.id, ...d.data()}));
      pending.delete(col); if (!pending.size) S.ready = true; schedule();
    }, () => { pending.delete(col); if (!pending.size) S.ready = true; schedule(); });
  });
  if (!pending.size) S.ready = true;
  db.doc("config/empresa").onSnapshot(s => { S.cfg = s.exists ? s.data() : {}; if (S.cfg.nome) $("#brandName").textContent = S.cfg.nome; schedule(); }, () => {});
  render();
})();
const obs = new MutationObserver(() => { if (!$("#ov") && S.dirty) { S.dirty = false; render(); } });
obs.observe($("#modalRoot"), {childList:true});
})();
</script>

</body></html>
